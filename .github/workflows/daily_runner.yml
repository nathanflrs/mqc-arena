name: Daily Runner

on:
  schedule:
    # Le run quotidien de l'arène a été RETIRÉ d'ici le 2026-08-13 : il tourne
    # désormais sur le serveur (milan-run.timer), seul à disposer du vrai
    # portefeuille IBKR.
    #
    # Le laisser aurait produit deux historiques contradictoires dans les mêmes
    # fichiers. Sans broker, le runner en CI reconstruit un portefeuille fictif
    # de 100 000 $ vide à chaque exécution : ses décisions ne décrivent aucun
    # compte réel, et mélangées à celles du serveur elles rendaient le track
    # record inanalysable.
    # Les trois planifications qui envoyaient sur Telegram — briefing matinal,
    # tearsheet hebdomadaire, factsheet mensuelle — sont retirées le 2026-08-13.
    # Le pilotage passe désormais par le dashboard et les notifications web, et
    # le jeton du bot s'était retrouvé public dans l'historique Git le
    # 2026-06-03. Les jobs restent déclenchables à la main.
    - cron: '30 14 * * 1-5'   # Mon–Fri 14:30 UTC (10:30 ET — shadow mode)
  workflow_dispatch:            # manual trigger from GitHub UI

jobs:
  # Conservé pour un déclenchement manuel de dépannage uniquement (analyse sans
  # broker). N'est plus planifié — voir le commentaire ci-dessus.
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run arena runner
        env:
          CI: "true"
          # Origine du run, conservée par le verrou puis lisible dans les logs.
          # Distingue une séance produite par le planificateur d'une séance
          # forcée à la main depuis le dashboard — un run manuel est une
          # décision discrétionnaire et n'a pas le même statut dans un track
          # record. Voir src/execution/run_lock.py.
          RUN_TRIGGER: "scheduled"
          # Broker (IBKR unavailable on CI — runner degrades gracefully)
          IBKR_PORT: ${{ secrets.IBKR_PORT }}
          IBKR_CLIENT_ID: ${{ secrets.IBKR_CLIENT_ID }}
          # Execution guard (keep false on CI — no live orders from GitHub Actions)
          EXECUTION_ENABLED: "false"
          MAX_ORDERS_PER_RUN: ${{ secrets.MAX_ORDERS_PER_RUN }}
          MAX_NOTIONAL_PCT: ${{ secrets.MAX_NOTIONAL_PCT }}
          LIMIT_BUFFER_BPS: ${{ secrets.LIMIT_BUFFER_BPS }}
          # Risk manager
          RISK_MAX_NET_LONG_PCT: ${{ secrets.RISK_MAX_NET_LONG_PCT }}
          RISK_MAX_SINGLE_POSITION_PCT: ${{ secrets.RISK_MAX_SINGLE_POSITION_PCT }}
          RISK_MIN_CASH_PCT: ${{ secrets.RISK_MIN_CASH_PCT }}
          RISK_SELL_ONLY_MODE: ${{ secrets.RISK_SELL_ONLY_MODE }}
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_APPROVAL_TIMEOUT: ${{ secrets.TELEGRAM_APPROVAL_TIMEOUT }}
          # Misc
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          MIN_SCORE_THRESHOLD: ${{ secrets.MIN_SCORE_THRESHOLD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m src.arena.runner

      - name: Commit updated logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # `git add` échoue EN BLOC si un seul pathspec ne correspond à rien :
          # rien n'est stagé, pas même les fichiers valides. Le `|| true` qui
          # suivait avalait l'erreur et `git diff --staged --quiet` réussissait,
          # donc aucun commit ne partait — jamais. var_latest.json et
          # entry_prices.json ne sont produits que si le run a des positions,
          # ce qui n'arrive pas en CI : la sauvegarde des décisions était donc
          # perdue à chaque séance depuis l'écriture de ce workflow.
          # On ajoute fichier par fichier, en ignorant ceux qui n'existent pas.
          for f in logs/decisions.csv logs/order_plan.csv logs/var_latest.json \
                   logs/circuit_breaker.json logs/allocator_cache.json \
                   logs/entry_prices.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || \
            (git commit -m "chore: runner logs $(date +%Y-%m-%d)" && \
             git pull --rebase origin main && \
             git push origin main)

  weekly_tearsheet:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly tearsheet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.notify.weekly_tearsheet

  shadow_mode:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run shadow mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CI: "true"
        run: python -m src.backtest.shadow_mode

      - name: Commit shadow signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/shadow_signals.csv
          git diff --staged --quiet || (git commit -m "chore: shadow signals $(date +%Y-%m-%d)" && git pull --rebase && git push)

  monthly_factsheet:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send factsheet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.notify.monthly_factsheet

  morning_briefing:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.notify.morning_briefing
